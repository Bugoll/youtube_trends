name: Daily YouTube Trends

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-trends
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily_package + final_intelligence_report from source repo
        env:
          MYCRABS_TOKEN: ${{ secrets.MYCRABS_TOKEN }}
          MYCRABS_REPO: ${{ vars.MYCRABS_REPO || 'bugoll/MyCrabs' }}
          SOURCE_DIR: ${{ vars.SOURCE_DIR || 'youtube-daily' }}
        run: python scripts/fetch_packages.py --dest data/raw

      - name: Build dashboard + graph (pass 1 — ingest new packages)
        run: python scripts/process.py --raw data/raw --out docs/data

      - name: Enrich new video metadata via LLM (incremental)
        env:
          # Anthropic (cloud): set ANTHROPIC_API_KEY secret to enable
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Ollama (local): set OLLAMA_MODEL var (e.g. llama3) + OLLAMA_BASE_URL if non-default
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
        run: |
          python scripts/enrich.py \
            --out docs/data \
            --limit ${{ vars.ENRICH_LIMIT || 30 }} \
            || echo "::warning::enrich.py finished with errors — continuing"

      - name: Refresh YouTube metrics via yt-dlp
        run: |
          python scripts/refresh_metrics.py \
            --out docs/data \
            --limit ${{ vars.REFRESH_LIMIT || 300 }} \
            || echo "::warning::refresh_metrics finished with errors — continuing"

      - name: Rebuild dashboard + graph (pass 2 — enriched + fresh metrics)
        run: python scripts/process.py --raw data/raw --out docs/data

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
